name: Build and release deployment wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# The default is deliberately read-only. Only the tag-release job can write a
# GitHub release, and PyPI publishing is intentionally not part of this fork.
permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test tokenizer core
        run: cargo test --release --manifest-path rwkv-tokenizer/Cargo.toml

  linux-x86_64-wheels:
    name: Linux x86_64 wheels
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build manylinux wheels for CPython 3.10 to 3.12
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: x86_64
          # PyO3 0.23.5 supports CPython through 3.13. Explicitly select the
          # deployment ABIs so a newly added manylinux interpreter cannot
          # silently break releases (for example CPython 3.14).
          args: >-
            --release --out dist
            --interpreter /opt/python/cp310-cp310/bin/python
            /opt/python/cp311-cp311/bin/python
            /opt/python/cp312-cp312/bin/python
          manylinux: auto
          sccache: "true"
      - name: Verify the CPython 3.11 wheel public API
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --force-reinstall --no-deps dist/*-cp311-cp311-*.whl

          # Do not run from bindings/python: its source package shadows the
          # installed wheel and would make this a source-tree test instead.
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "${smoke_dir}"' EXIT
          cp tests/test_package_smoke.py "${smoke_dir}/"
          cd "${smoke_dir}"
          python - <<'PY'
          from pathlib import Path
          import pyrwkv_tokenizer

          module_path = Path(pyrwkv_tokenizer.__file__).resolve()
          assert "site-packages" in module_path.parts, module_path
          print(f"Testing installed wheel from: {module_path}")
          PY
          python -m pytest -q test_package_smoke.py
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  linux-aarch64-wheels:
    name: Linux aarch64 wheels
    # This is a native ARM64 GitHub-hosted runner. The previous x86_64 cross
    # container cannot execute /opt/python/cp*-cp* ARM binaries, which caused
    # the "Exec format error" from PyO3 metadata discovery.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build manylinux wheels for CPython 3.10 to 3.12
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: aarch64
          args: >-
            --release --out dist
            --interpreter /opt/python/cp310-cp310/bin/python
            /opt/python/cp311-cp311/bin/python
            /opt/python/cp312-cp312/bin/python
          manylinux: auto
          sccache: "true"
      - name: Verify the CPython 3.11 wheel public API
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --force-reinstall --no-deps dist/*-cp311-cp311-*.whl

          # Do not run from bindings/python: its source package shadows the
          # installed wheel and would make this a source-tree test instead.
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "${smoke_dir}"' EXIT
          cp tests/test_package_smoke.py "${smoke_dir}/"
          cd "${smoke_dir}"
          python - <<'PY'
          from pathlib import Path
          import pyrwkv_tokenizer

          module_path = Path(pyrwkv_tokenizer.__file__).resolve()
          assert "site-packages" in module_path.parts, module_path
          print(f"Testing installed wheel from: {module_path}")
          PY
          python -m pytest -q test_package_smoke.py
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-aarch64
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Attach wheels to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust-tests, linux-x86_64-wheels, linux-aarch64-wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: dist
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
          fi
