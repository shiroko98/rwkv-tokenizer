name: Build and release deployment wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# The default is deliberately read-only. Only the tag-release job can write a
# GitHub release, and PyPI publishing is intentionally not part of this fork.
permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test tokenizer core
        run: cargo test --release --manifest-path rwkv-tokenizer/Cargo.toml

  linux-wheels:
    name: Linux ${{ matrix.target }} wheels
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      # maturin-action's manylinux Docker runners are validated against
      # Ubuntu 22.04. Keep this pinned instead of the moving ubuntu-latest.
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build manylinux wheels for every supported CPython
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          # In a manylinux container, --find-interpreter discovers the
          # container's CPython installations. Passing the host runner's
          # `python` path into Docker causes the build action to fail.
          args: --release --out dist --find-interpreter
          manylinux: auto
          sccache: "true"
      - name: Verify the CPython 3.11 x86_64 wheel public API
        if: matrix.target == 'x86_64'
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --force-reinstall --no-deps dist/*-cp311-cp311-*.whl
          python -m pytest -q tests/test_package_smoke.py
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Attach wheels to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust-tests, linux-wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: dist
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
          fi
