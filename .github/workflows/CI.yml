name: Build and release deployment wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# The default is deliberately read-only. Only the tag-release job can write a
# GitHub release, and PyPI publishing is intentionally not part of this fork.
permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test tokenizer core
        run: cargo test --release --manifest-path rwkv-tokenizer/Cargo.toml

  linux-wheels:
    name: Linux ${{ matrix.target }} / CPython ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter python
          manylinux: "2_17"
          sccache: "true"
      - name: Verify x86_64 wheel public API
        if: matrix.target == 'x86_64'
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pytest -q tests/test_package_smoke.py
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.target }}-py${{ matrix.python }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Attach wheels to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust-tests, linux-wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: dist
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
          fi
