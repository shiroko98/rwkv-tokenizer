[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pyrwkv-tokenizer-rwkv7"
version = "0.9.2"
requires-python = ">=3.10"
description = "Rust RWKV tokenizer fork with explicit token IDs and Python buffer loading"
readme = "README.md"
license = {file = "LICENSE.txt"}
keywords = ["LLM", "RWKV", "Language Model"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
homepage = "https://github.com/shiroko98/rwkv-tokenizer"
documentation = "https://github.com/shiroko98/rwkv-tokenizer"
repository = "https://github.com/shiroko98/rwkv-tokenizer"
changelog = "https://github.com/shiroko98/rwkv-tokenizer/releases"

[tool.maturin]
features = ["pyo3/extension-module"]

[project.optional-dependencies]
dev = ["pytest"]
